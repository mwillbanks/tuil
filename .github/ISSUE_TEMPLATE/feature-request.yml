name: Feature request
description: Propose a focused capability or behavior change.
title: "feat: "
labels: ["enhancement", "needs-triage"]
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues and discussions for this proposal.
          required: true
        - label: This request describes a problem, not only a preferred implementation.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who is blocked, in what terminal workflow, and why current behavior is insufficient?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe observable behavior and a concrete success case.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Primary surface
      multiple: true
      options:
        - Runtime and lifecycle
        - Ink rendering and input
        - Components and registry
        - Forms, focus, or hotkeys
        - Router, operations, or workflows
        - Plugins or themes
        - Testing or stories
        - CLI or skills
        - Documentation
    validations:
      required: true
  - type: textarea
    id: api
    attributes:
      label: Proposed API or interaction
      description: Show a compact usage example when the request changes public API.
      render: tsx
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include current workarounds and their tradeoffs.
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and terminal constraints
      description: Address interactive/static modes, accessibility, cleanup, migration, and possible breaking changes.
    validations:
      required: true
