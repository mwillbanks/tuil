name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full commit SHA containing the existing release tags
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Workspace validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun ci
      - name: Verify conventional pull request title
        if: ${{ github.event_name == 'pull_request' }}
        env:
          COMMITLINT_PR_TITLE: "true"
          PULL_REQUEST_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PULL_REQUEST_TITLE" | bunx --no-install commitlint
      - name: Verify workspace
        run: bun run check
      - name: Publish coverage
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: true
          files: ./coverage/lcov.info
          use_oidc: true
      - name: Audit pull request changes
        if: ${{ github.event_name == 'pull_request' }}
        run: bun run fallow:audit -- --base "${{ github.event.pull_request.base.sha }}"
      - name: Verify publication contents
        run: bun run test:publication
      - name: Verify terminal performance baselines
        run: bun run benchmark:terminal

  documentation:
    name: Documentation validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun ci
      - name: Verify documentation
        env:
          NEXT_PUBLIC_BASE_PATH: /tuil
        run: bun run docs:check

  dependencies:
    name: Dependency security
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.3.8
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      scan-args: |-
        --config=./osv-scanner.toml
        --lockfile=./bun.lock
      upload-sarif: false
      fail-on-vuln: true

  release:
    name: Release
    needs: [quality, documentation, dependencies]
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/release.yml
    secrets: inherit
    with:
      release_sha: ${{ github.event_name == 'workflow_dispatch' && inputs.release_sha || '' }}
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write
