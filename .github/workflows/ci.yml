name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full commit SHA containing the existing release tags
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Workspace validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun ci
      - name: Install Chromium for acceptance
        run: bun run --bun playwright install --with-deps chromium
      - name: Verify workspace
        env:
          TUIL_BUILD_ALL: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release-please--branches--main') }}
          TUIL_BUILD_BASE: ${{ github.event.pull_request.base.sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || 'HEAD' }}
        run: bun run validate
      - name: Verify authored release notes
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--branches--main')
        env:
          RELEASE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          bun tooling/release/notes.ts check --base "$RELEASE_BASE_SHA"
          bun run publication:verify
      - name: Publish coverage
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: true
          disable_search: true
          files: ./coverage/lcov.info,./coverage/coverage-final.json
          use_oidc: true
      - name: Audit pull request changes
        if: ${{ github.event_name == 'pull_request' }}
        run: bun run fallow:audit -- --base "${{ github.event.pull_request.base.sha }}"
      - name: Verify terminal performance baselines
        run: bun run benchmark:terminal

  dependencies:
    name: Dependency security
    uses: ./.github/workflows/security.yml
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      upload-sarif: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

  release:
    name: Release
    needs: [quality, dependencies]
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/release.yml
    secrets: inherit
    with:
      release_sha: ${{ github.event_name == 'workflow_dispatch' && inputs.release_sha || '' }}
    permissions:
      attestations: write
      contents: write
      id-token: write
      issues: write
      pull-requests: write
