name: Dependency security

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/security.yml"
      - "bun.lock"
      - "osv-scanner.toml"
      - "**/package.json"
  schedule:
    - cron: "19 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.3.8
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      scan-args: |-
        --config=./osv-scanner.toml
        --lockfile=./bun.lock
      upload-sarif: true
      fail-on-vuln: true
