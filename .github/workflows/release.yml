name: Release

on:
  workflow_call:
    inputs:
      release_sha:
        description: Full commit SHA containing the existing release tags
        required: false
        type: string
        default: ""
    secrets:
      RELEASE_PLEASE_TOKEN:
        required: true

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ inputs.release_sha == '' }}
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.release-commit.outputs.release_sha }}
      releases_created: ${{ steps.release.outputs.releases_created }}
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@v5.0.0
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
      - name: Resolve updated release branch
        id: release-pr
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        env:
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          branch="$(jq -r '.headBranchName // empty' <<<"$RELEASE_PR")"
          if [[ -z "$branch" ]]; then
            echo "::error::Release Please did not return a release PR branch."
            exit 1
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
      - name: Checkout pending release branch
        if: steps.release-pr.outputs.branch != ''
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ steps.release-pr.outputs.branch }}
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
      - uses: oven-sh/setup-bun@v2.2.0
        if: steps.release-pr.outputs.branch != ''
        with:
          bun-version: 1.3.14
      - name: Install release branch dependencies
        if: steps.release-pr.outputs.branch != ''
        run: bun ci
      - name: Regenerate release branch artifacts
        if: steps.release-pr.outputs.branch != ''
        run: |
          bun run registry:build
          bun run registry:check
      - name: Commit release branch artifacts
        if: steps.release-pr.outputs.branch != ''
        env:
          RELEASE_BRANCH: ${{ steps.release-pr.outputs.branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Release branch artifacts are already current."
          else
            HUSKY=0 git commit -m "chore: update release artifacts"
            HUSKY=0 git push origin "HEAD:$RELEASE_BRANCH"
          fi
      - uses: actions/checkout@v7.0.1
        if: ${{ steps.release.outputs.releases_created == 'true' }}
      - uses: oven-sh/setup-bun@v2.2.0
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        with:
          bun-version: 1.3.14
      - name: Resolve immutable release commit
        id: release-commit
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        env:
          RELEASED_PATHS: ${{ steps.release.outputs.paths_released }}
          RELEASE_SHAS: |-
            ${{ steps.release.outputs['packages/cell--sha'] }}
            ${{ steps.release.outputs['packages/cli--sha'] }}
            ${{ steps.release.outputs['packages/code--sha'] }}
            ${{ steps.release.outputs['packages/content--sha'] }}
            ${{ steps.release.outputs['packages/core--sha'] }}
            ${{ steps.release.outputs['packages/devtools--sha'] }}
            ${{ steps.release.outputs['packages/editor--sha'] }}
            ${{ steps.release.outputs['packages/events--sha'] }}
            ${{ steps.release.outputs['packages/focus--sha'] }}
            ${{ steps.release.outputs['packages/form--sha'] }}
            ${{ steps.release.outputs['packages/hotkeys--sha'] }}
            ${{ steps.release.outputs['packages/ink--sha'] }}
            ${{ steps.release.outputs['packages/log-viewer--sha'] }}
            ${{ steps.release.outputs['packages/logging--sha'] }}
            ${{ steps.release.outputs['packages/operations--sha'] }}
            ${{ steps.release.outputs['packages/plugin--sha'] }}
            ${{ steps.release.outputs['packages/pointer--sha'] }}
            ${{ steps.release.outputs['packages/protocol--sha'] }}
            ${{ steps.release.outputs['packages/registry--sha'] }}
            ${{ steps.release.outputs['packages/renderer--sha'] }}
            ${{ steps.release.outputs['packages/router--sha'] }}
            ${{ steps.release.outputs['packages/scroll--sha'] }}
            ${{ steps.release.outputs['packages/story--sha'] }}
            ${{ steps.release.outputs['packages/streaming--sha'] }}
            ${{ steps.release.outputs['packages/testing-ink--sha'] }}
            ${{ steps.release.outputs['packages/testing--sha'] }}
            ${{ steps.release.outputs['packages/theme--sha'] }}
            ${{ steps.release.outputs['packages/tuil--sha'] }}
            ${{ steps.release.outputs['packages/virtual--sha'] }}
            ${{ steps.release.outputs['packages/workflow--sha'] }}
        run: bun tooling/release/resolve-release-sha.ts

  publish:
    needs: release
    if: >-
      ${{
        always() &&
        (
          (
            inputs.release_sha != '' &&
            needs.release.result == 'skipped'
          ) ||
          (
            inputs.release_sha == '' &&
            needs.release.result == 'success' &&
            needs.release.outputs.releases_created == 'true' &&
            needs.release.outputs.release_sha != ''
          )
        )
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_sha || needs.release.outputs.release_sha }}
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install dependencies
        run: bun ci
      - name: Verify recovery release commit
        if: ${{ inputs.release_sha != '' }}
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: bun tooling/release/verify-recovery.ts
      - name: Build and publish unpublished packages
        run: bun run release
