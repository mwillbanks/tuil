[test]
bail = 1
coverage = true
coverageThreshold = { lines = 0.95, functions = 0.95, statements = 0.95 }
coverageReporter = ["text", "lcov"]
coverageSkipTestFiles = true

# The documentation has its own package-level test and build gate. Generated
# registry mirrors are byte-validated against their source owners.
coveragePathIgnorePatterns = [
  "apps/docs/**",
  "packages/cli/src/generated-ui/**",
  "packages/cli/src/generated-registry.ts",
  "registry/**/*.stories.tsx",
]
onlyFailures = true
pathIgnorePatterns = ["apps/docs/**"]
