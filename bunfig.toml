[install]
linker = "hoisted"

[fmt]
# Generated reference and registry files are checked against their source owners.
ignorePatterns = [
  "apps/docs/content/docs/reference/",
  "packages/*/CHANGELOG.md",
  "packages/cli/src/generated-ui/",
  "packages/cli/src/generated-registry.ts",
]

[test]
bail = 1
coverage = true

# The full-suite gate enforces aggregate coverage with instrumented statements.
# Bun's native text thresholds apply per file and do not enforce statements.
coverageReporter = ["text", "lcov"]
coverageSkipTestFiles = true

# The documentation has its own package-level test and build gate. Generated
# registry mirrors are byte-validated against their source owners.
coveragePathIgnorePatterns = [
  "apps/docs/**",
  "packages/cli/src/generated-ui/**",
  "packages/cli/src/generated-registry.ts",
  "packages/code/src/worker.ts",
  "tooling/build/build-all.ts",
  "tooling/build/build-ecosystem.ts",
  "tooling/build/package.ts",
  "tooling/build/workspace.ts",
  "registry/**/*.stories.tsx",
  "tooling/browser/**",
]
onlyFailures = true
